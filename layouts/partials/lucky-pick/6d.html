<h3 id="try-our-6d-number-generator">Try our 6D Number Generator</h3>

<table>
  <thead>
    <tr>
      <th>#1</th>
      <th>#2</th>
      <th>#3</th>
      <th>#4</th>
      <th>#5</th>
      <th>#6</th>
    </tr>
  </thead>
  <tbody>
    <tr id="numbers-row">
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
    </tr>
  </tbody>
</table>
<button id="lucky-pick">🎯 Lucky Pick</button>

<script>
  function getRandomDigit(exclude) {
    let num;
    do {
      num = Math.floor(Math.random() * 10); // 0–9
    } while (num === exclude); // force change per cell
    return num;
  }

  function generateRandomNumbers(lastNumbers) {
    const numbers = [];
    for (let i = 0; i < 6; i++) {
      numbers.push(getRandomDigit(lastNumbers[i]));
    }
    return numbers;
  }

  function formatWithLeadingZero(num) {
    return num < 10 ? '0' + num : num.toString();
  }

  let lastNumbers = [-1, -1, -1, -1, -1, -1]; // init impossible values

  function populateNumbers() {
    const numbers = generateRandomNumbers(lastNumbers);
    lastNumbers = numbers;

    const cells = document.querySelectorAll('#numbers-row td');
    cells.forEach((cell, index) => {
      cell.textContent = formatWithLeadingZero(numbers[index]);
    });
  }

  document.getElementById('lucky-pick').addEventListener('click', populateNumbers);

  // Generate numbers when page loads
  populateNumbers();
</script>
