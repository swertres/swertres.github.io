<h2 id="how-much-is-the-6d-lotto-ticket">How much is the 6D Lotto ticket?</h2>

<p>A <strong>6D Lotto</strong> ticket costs <strong>₱12.00 per play</strong>. You can use the same number combination for <strong>up to six (6) consecutive draws</strong>. To know your total cost, simply calculate: <strong>₱12.00 × number of draws</strong>.</p>
