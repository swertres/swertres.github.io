<h2 id="how-much-is-the-6-49-super-lotto-ticket">How much is the 6/49 Super Lotto ticket?</h2>

<p>A <strong>6/49 Super Lotto</strong> ticket costs <strong>₱20.00 per play</strong>. You can use the same number combination for <strong>up to six (6) consecutive draws</strong>. To know your total cost, simply calculate: <strong>₱20.00 × number of draws</strong>.</p>
