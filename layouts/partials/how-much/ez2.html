<h2 id="how-much-is-the-2d-ez2-lotto-ticket">How much is the 2D EZ2 Lotto ticket?</h2>

<p>A <strong>2D EZ2 Lotto</strong> ticket costs <strong>₱10.00 per play</strong>. You can use the same number combination for <strong>up to six (6) consecutive draws</strong>. To know your total cost, simply calculate: <strong>₱10.00 × number of draws</strong>.</p>
