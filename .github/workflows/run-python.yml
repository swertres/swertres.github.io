name: Build, Scrape, and Deploy

env:
  # Define tool versions
  DART_SASS_VERSION: 1.104.0
  GO_VERSION: 1.27.0
  HUGO_VERSION: 0.119.0
  NODE_VERSION: 24.20.0

  # Set the build time zone
  TZ: Europe/Oslo

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Philippine Time (UTC+8)

    # 2:00 PM – 2:10 PM
    - cron: '0 6 * * *'    # 14:00 PH
    - cron: '2 6 * * *'    # 14:02 PH
    - cron: '3 6 * * *'    # 14:03 PH
    - cron: '5 6 * * *'    # 14:05 PH
    - cron: '10 6 * * *'   # 14:10 PH

    # 5:00 PM – 5:10 PM
    - cron: '0 9 * * *'    # 17:00 PH
    - cron: '2 9 * * *'    # 17:02 PH
    - cron: '3 9 * * *'    # 17:03 PH
    - cron: '5 9 * * *'    # 17:05 PH
    - cron: '10 9 * * *'   # 17:10 PH

    # 9:00 PM – 9:20 PM
    - cron: '0 13 * * *'   # 21:00 PH
    - cron: '5 13 * * *'   # 21:05 PH
    - cron: '10 13 * * *'  # 21:10 PH
    - cron: '15 13 * * *'  # 21:15 PH
    - cron: '20 13 * * *'  # 21:20 PH

    # 9:30 PM
    - cron: '30 13 * * *'  # 21:30 PH

    # 10:30 PM
    - cron: '30 14 * * *'  # 22:30 PH
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false

      - name: Create z.py from secret
        env:
          _Z: ${{ secrets._Z }}
        run: |
          printf '%s\n' "$_Z" > z.py

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3

      - name: Run Python scraper
        run: |
          set -euo pipefail
          python z.py

          if ! find data -maxdepth 1 -type f -name '*.csv' -print -quit | grep -q .; then
            echo "::error::Scraper produced no CSV files"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          set -euo pipefail
          shopt -s nullglob
          csv_files=(data/*.csv)

          if ((${#csv_files[@]} == 0)); then
            echo "No CSV files found; skipping commit."
            exit 0
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -- "${csv_files[@]}"

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "🤖 Auto-update: Data scraped at $(TZ='Asia/Manila' date +'%Y-%m-%d %H:%M PH Time') [skip ci]"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "HEAD:${{ github.ref }}"

      - name: Create Hugo configuration and private files
        env:
          _4D: ${{ secrets._4D }}
          _6_42: ${{ secrets._6_42 }}
          _6_45: ${{ secrets._6_45 }}
          _6_49: ${{ secrets._6_49 }}
          _6_55: ${{ secrets._6_55 }}
          _6_58: ${{ secrets._6_58 }}
          _6D: ${{ secrets._6D }}
          _EZ2: ${{ secrets._EZ2 }}
          _HOME: ${{ secrets._HOME }}
          _SWERTRES: ${{ secrets._SWERTRES }}
          _CONFIG: ${{ secrets._CONFIG }}
        run: |
          mkdir -p config/_default layouts/section layouts/partials/components/headers layouts/shortcodes/data
          printf '%s\n' "$_4D" > layouts/shortcodes/data/4d.html
          printf '%s\n' "$_6_42" > layouts/shortcodes/data/6-42.html
          printf '%s\n' "$_6_45" > layouts/shortcodes/data/6-45.html
          printf '%s\n' "$_6_49" > layouts/shortcodes/data/6-49.html
          printf '%s\n' "$_6_55" > layouts/shortcodes/data/6-55.html
          printf '%s\n' "$_6_58" > layouts/shortcodes/data/6-58.html
          printf '%s\n' "$_6D" > layouts/shortcodes/data/6d.html
          printf '%s\n' "$_EZ2" > layouts/shortcodes/data/ez2.html
          printf '%s\n' "$_HOME" > layouts/shortcodes/data/home.html
          printf '%s\n' "$_SWERTRES" > layouts/shortcodes/data/swertres.html
          printf '%s\n' "$_CONFIG" > config.toml

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Create a local tools directory
        run: |
          mkdir -p "${HOME}/.local"

      - name: Install Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dart Sass
        run: |
          echo "Installing Dart Sass ${DART_SASS_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "${{ runner.temp }}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log tool versions
        run: |
          echo "Logging tool versions..."
          command -v sass &> /dev/null && echo "Dart Sass: $(sass --version)" || echo "Dart Sass: not installed"
          command -v go &> /dev/null && echo "Go: $(go version)" || echo "Go: not installed"
          command -v hugo &> /dev/null && echo "Hugo: $(hugo version)" || echo "Hugo: not installed"
          command -v node &> /dev/null && echo "Node.js: $(node --version)" || echo "Node.js: not installed"

      - name: Configure Git
        run: |
          echo "Configuring Git..."
          git config --global core.quotepath false

      - name: Fetch full Git history
        run: |
          if [[ $(git rev-parse --is-shallow-repository) == true ]]; then
            echo "Fetching full Git history..."
            git fetch --unshallow
          fi

      - name: Initialize Git submodules
        run: |
          if [[ -f .gitmodules ]]; then
            echo "Initializing Git submodules..."
            git submodule update --init --recursive
          fi

      - name: Install Node.js dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            echo "Installing Node.js dependencies..."
            npm ci
          fi

      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      - name: Build
        run: |
          echo "Building the project..."
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/.cache/hugo"

      - name: Cache save
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5