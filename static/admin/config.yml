backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master)
media_folder: static/img
public_folder: /img
local_backend: true # npx decap-server
collections:
  - name: 'post'
    label: 'Post'
    folder: 'content/post/'
    # path: '{{slug}}/index'
    create: true
    # slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Result", name: "result", widget: "string", required: false }
      - { label: "2pm Result", name: "twoPm", widget: "string", required: false }
      - { label: "5pm Result", name: "fivePm", widget: "string", required: false }
      - { label: "9pm Result", name: "ninePm", widget: "string", required: false }

      - { label: 'Publish Date', name: 'date', widget: 'hidden' }
      - { label: 'Expiry Date', name: 'expiryDate', widget: 'hidden' }
      - { label: 'Author', name: 'author', widget: 'hidden', default: "Manalotto" }
      - { label: "Draft", name: "draft", widget: "hidden", default: false }
      - { label: 'Thumbnail', name: "thumbnail", widget: 'hidden' }
      - { label: 'Tags', name: 'tags', widget: 'hidden' }
      - { label: 'Body', name: 'body', widget: 'hidden', required: false }
